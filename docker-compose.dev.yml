services:
  # Control Plane Backend (Hot Reload)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: owlapi_backend_dev
    command: air -c .air.server.toml
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9090:9090"
    volumes:
      - ./backend:/app
      - /app/tmp # Mount tmp as anonymous volume to avoid host permission issues and conflicts
    # 所有 backend 服务环境变量统一从 backend/.env 读取——单一来源、好维护
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully

  # Admin Frontend (Hot Reload)
  admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile.dev
    container_name: owlapi_admin_dev
    command: sh -c "pnpm install && PORT=8001 pnpm dev"
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./frontend/admin:/app
      - /app/node_modules # Anonymous volume for container dependencies
      - /app/.next # Anonymous volume for build cache
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy

  # Local Gateway Node (Hot Reload)
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: owlapi_gateway_dev
    command: air -c .air.gateway.toml
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/tmp
      - gateway_data:/data
    # gateway 用到的 OWLAPI_SERVER_URL / GATEWAY_ID / TOKEN / TENANT_ID / TZ / GOPROXY 都已在 backend/.env
    env_file:
      - ./backend/.env
    depends_on:
      backend:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully

  # SDK Builder Sidecar (EE-only — wraps openapi-generator-cli)
  # 默认不启动；用 `docker compose --profile ee up sdkbuilder` 显式拉起。
  sdkbuilder:
    profiles: ["ee"]
    build:
      context: ./backend
      dockerfile: cmd/sdkbuilder/Dockerfile
    container_name: owlapi_sdkbuilder_dev
    restart: unless-stopped
    # 用 7100 而不是 7000——macOS AirPlay Receiver 默认占 5000/7000。
    # host 和 container 内部端口保持一致，省得心智上两个 number。
    ports:
      - "7100:7100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7100/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  # PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: owlapi_postgres
    restart: unless-stopped
    command: postgres -c log_min_messages=WARNING -c log_min_error_statement=WARNING
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=owlapi
      - TZ=Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432" # Use 5433 to avoid conflict with local postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Init: schema + seed demo data (runs every startup)
  backend-init:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: owlapi_init_dev
    command: go run cmd/init/main.go
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Docs Site (VitePress)
  docs:
    image: node:22-alpine
    container_name: owlapi_docs_dev
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm docs:dev --host 0.0.0.0 --port 8003"
    restart: unless-stopped
    ports:
      - "8003:8003"
    volumes:
      - ./frontend/docs:/app
      - /app/node_modules

volumes:
  postgres_data:
  gateway_data:
