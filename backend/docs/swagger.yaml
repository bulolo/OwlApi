      - description: 用户ID
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.R'
      security:
      - BearerAuth: []
      summary: 移除租户成员
      tags:
      - tenant-user
  /v1/tenants/{slug}/users/{userId}/role:
    put:
      consumes:
      - application/json
      operationId: updateUserRole
      parameters:
      - description: 租户slug
        in: path
        name: slug
        required: true
        type: string
      - description: 用户ID
        in: path
        name: userId
        required: true
        type: integer
      - description: 角色
        in: body
        name: body
        required: true
        schema:
          properties:
            role:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.R'
      security:
      - BearerAuth: []
      summary: 更新成员角色
      tags:
      - tenant-user
securityDefinitions:
  BearerAuth:
    description: '格式: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
