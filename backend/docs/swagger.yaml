      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/http.R'
      security:
      - BearerAuth: []
      summary: 添加租户成员
      tags:
      - tenant-user
  /v1/tenants/{slug}/users/{userId}:
    delete:
      operationId: removeUser
      parameters:
      - description: 租户slug
        in: path
        name: slug
        required: true
