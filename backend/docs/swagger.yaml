      summary: 从平台内置脚本复制一份到租户脚本库
      tags:
      - script
  /v1/tenants/{slug}/settings:
    put:
      consumes:
      - application/json
      operationId: updateTenantSettings
      parameters:
      - description: 租户slug
        in: path
        name: slug
        required: true
        type: string
      - description: 配置项
        in: body
        name: body
        required: true
        schema:
          properties:
            max_release_versions:
