basePath: /
definitions:
  domain.APIEndpoint:
    properties:
      created_at:
        type: string
      datasource_alias:
        type: string
      description:
        type: string
      env_activations:
        description: per-env active version snapshot (one row per env where this endpoint
          is live)
        items:
          $ref: '#/definitions/domain.EndpointEnvActivity'
        type: array
      group_id:
        type: integer
      has_draft:
        description: 'Derived/computed fields (not stored on the row itself):'
        type: boolean
      id:
        type: integer
      latest_version:
        description: newest version number in endpoint_versions for this endpoint
        type: integer
      method:
        type: string
      param_defs:
        items:
          $ref: '#/definitions/domain.ParamDef'
        type: array
      path:
        type: string
      post_scripts:
        items:
          $ref: '#/definitions/domain.ScriptStep'
        type: array
      pre_scripts:
        description: |-
          PreScripts / PostScripts are ordered chains run sequentially around the SQL.
          Each step is either a reference to a reusable library script or inline code
          stored on the endpoint itself (see ScriptStep). In the pre-chain each stage's
          output params feed the next and any `{ error }` short-circuits; in the
          post-chain each stage's output becomes the next stage's `data`, and the last
          stage's output is the response body.
        items:
          $ref: '#/definitions/domain.ScriptStep'
        type: array
      project_id:
        type: integer
      response_defs:
        items:
          $ref: '#/definitions/domain.ResponseDef'
        type: array
      sql:
        type: string
      summary:
        type: string
      tenant_id:
        type: integer
      updated_at:
        type: string
    type: object
  domain.EndpointEnvActivity:
    properties:
      env_id:
        type: integer
      env_name:
        type: string
      version:
        type: integer
      version_id:
        type: integer
    type: object
  domain.ParamDef:
    properties:
      default:
        type: string
      desc:
        type: string
      name:
        type: string
      required:
        type: boolean
      type:
        description: string, integer, number, boolean
        type: string
    type: object
  domain.ResponseDef:
