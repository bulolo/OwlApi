apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "owlapi.fullname" . }}-admin
  labels:
    {{- include "owlapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicas }}
  selector:
    matchLabels:
      {{- include "owlapi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        {{- include "owlapi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin
    spec:
      containers:
        - name: admin
          image: {{ include "owlapi.image" (dict "root" . "name" .Values.admin.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.admin.port }}
          env:
            - name: NEXT_PUBLIC_API_URL
              value: {{ .Values.admin.publicApiUrl | quote }}
            - name: PORT
              value: {{ .Values.admin.port | quote }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
