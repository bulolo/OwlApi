apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "owlapi.fullname" . }}-init
  labels:
    {{- include "owlapi.labels" . | nindent 4 }}
    app.kubernetes.io/component: init
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "owlapi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: {{ include "owlapi.image" (dict "root" . "name" .Values.backend.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./init"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "owlapi.fullname" . }}
                  key: DATABASE_URL
            - name: TZ
              value: {{ .Values.backend.env.tz | quote }}
